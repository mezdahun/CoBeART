<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>CoBeArt — Live Tracking Debug</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Socket.IO client served by the server automatically at /socket.io/socket.io.js -->
    <link rel="stylesheet" href="/shared-border.css">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: black;
            /* optional, avoids white borders while loading */
        }

        #fluidFrame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>

<body>
    <h1>CoBeArt — Live Tracking Debug</h1>
    <div class="row">
        <div class="badge">namespace: /viewer</div>
        <div class="badge">status: <span id="status">connecting…</span></div>
        <div class="badge">fps(rx): <span id="fps">0</span></div>
    </div>
    <pre id="out">{ waiting for data… }</pre>
    <script src="/socket.io/socket.io.js"></script>
    <!-- The fluid simulation is structured as an embedded standalone browser (black box). -->
    <iframe id="fluidFrame" src="/fluid/index.html">
    </iframe>
    <script src="/fluid-bridge.js"></script>
    <script src="/border-control.js"></script>

</body>

</html>
